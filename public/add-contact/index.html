<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add contact – Dash Chat</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- .hint comes from this shared sheet. -->
    <link rel="stylesheet" href="/css/platform-pick.css" />
    <style>
      :root {
        --bg: #fcfcfc; --surface: #fff; --surface-2: #f6f7f9;
        --text: #111; --muted: #555; --faint: #888; --border: #e5e7eb;
        --accent: #6E7BFF; --accent-hover: #5662E6;
        --focus-ring: color-mix(in srgb, var(--accent) 22%, transparent);
        --shadow-soft: 0 16px 40px rgba(17, 24, 39, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0c0f; --surface: #111318; --surface-2: #0f1116;
          --text: #e5e7eb; --muted: #94a3b8; --faint: #64748b; --border: #1e293b;
          --accent: #8C97FF; --accent-hover: #B0B8FF;
        }
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Rubik", system-ui, sans-serif;
        background: var(--bg); color: var(--text); line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: flex-start; padding: 56px 20px;
      }
      a:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 3px; }
      .card { width: 100%; max-width: 420px; text-align: center; }
      .logo { width: 60px; height: 60px; margin: 0 auto 16px; display: block; }
      .logo-link { display: block; }
      h1 { font-size: 1.55rem; font-weight: 700; margin-bottom: 6px; }
      .tagline { font-size: 0.96rem; color: var(--muted); margin-bottom: 32px; }

      /* Same numbered steps as the TestFlight guide on /test. */
      .steps { display: flex; flex-direction: column; gap: 12px; }
      .store-btn {
        display: flex; align-items: center; gap: 14px;
        padding: 14px 18px;
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: 12px;
        text-decoration: none; font-weight: 600; font-size: 1rem;
        box-shadow: var(--shadow-soft);
        transition: transform 0.15s, border-color 0.15s;
      }
      .store-btn:hover { transform: translateY(-1px); border-color: var(--accent); }
      .store-btn .label { flex: 1 1 auto; text-align: start; line-height: 1.3; }
      .store-btn .sub { display: block; font-weight: 400; font-size: 0.8rem; color: var(--faint); }
      .store-btn .step-num {
        flex: 0 0 24px; width: 24px; height: 24px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 50%; background: var(--accent); color: #fff;
        font-size: 0.9rem; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <a href="/" class="logo-link" title="Dash Chat home"><img class="logo" src="/dashchat-icon.png" alt="Dash Chat" width="60" height="60" /></a>
      <h1>Add contact</h1>
      <p class="tagline">Add this contact in Dash Chat.</p>

      <!-- Desktop browsers always land here, because only the phone apps claim
           dashchat.org links, and a page can't tell whether the app is installed.
           So the steps have to read correctly either way. -->
      <div class="steps">
        <a class="store-btn" id="download-step" href="/download/" rel="noopener">
          <span class="step-num">1</span>
          <span class="label">Download Dash Chat<span class="sub" dir="auto">If you don't have it installed yet</span></span>
        </a>
        <a class="store-btn" id="add-contact-step" href="dash-chat://add-contact/">
          <span class="step-num">2</span>
          <span class="label">Add contact<span class="sub" id="add-contact-sub" dir="auto">Click here to add the contact after Dash Chat is installed</span></span>
        </a>
      </div>
      <div class="hint" id="hints" dir="auto">Need a different build? <a href="/download/">See all downloads</a>.</div>
    </main>

    <script type="module">
      import { os, fetchLatestStableDesktopRelease, resolveAssets, macArchitecture, linkHint } from "/js/platform-pick.js?v=2";

      var APP_STORE = "https://apps.apple.com/us/app/dash-chat-messenger/id6759798505";
      var PLAY = "https://play.google.com/store/apps/details?id=studio.darksoil.dashchat";

      var downloadStep = document.getElementById("download-step");
      var hints = document.getElementById("hints");

      function offerMacDownload(urls, architecture) {
        var builds = [
          { url: urls.mac_arm, name: "Apple Silicon", question: "On an Apple Silicon Mac?" },
          { url: urls.mac_intel, name: "Intel", question: "On an Intel Mac?" },
        ];
        if (architecture === "intel") builds.reverse();
        var available = builds.filter(function (build) { return build.url; });
        if (!available.length) return;

        downloadStep.href = available[0].url;
        // Only Chromium can tell us the chip, so the guess must stay correctable:
        // the other chip's .dmg would not run.
        if (available[1]) {
          hints.before(linkHint(available[1].question, available[1].url, "Download the " + available[1].name + " build"));
        }
      }

      function offerDesktopDownload(release) {
        if (!release) return;
        var urls = resolveAssets(release);
        if (os === "win" && (urls.win_exe || urls.win_msi)) {
          downloadStep.href = urls.win_exe || urls.win_msi;
        } else if (os === "linux" && urls.linux) {
          downloadStep.href = urls.linux;
        } else if (os === "mac") {
          return macArchitecture().then(function (architecture) {
            offerMacDownload(urls, architecture);
          });
        }
      }

      var code = new URLSearchParams(window.location.search).get("code") || "";
      var addContactUrl = "dash-chat://add-contact/" + code;
      document.getElementById("add-contact-step").href = addContactUrl;

      if (os === "ios" || os === "android") {
        document.getElementById("add-contact-sub").textContent = "Tap here to add the contact after Dash Chat is installed";
      }

      if (os === "ios") {
        downloadStep.href = APP_STORE;
      } else if (os === "android") {
        downloadStep.href = PLAY;
      } else if (os !== "other") {
        // On a failed lookup step 1 keeps pointing at /download/.
        fetchLatestStableDesktopRelease().then(offerDesktopDownload).catch(function () {});

        // Desktop only: without the app, a scheme link fired on load makes iOS
        // Safari show an "address is invalid" alert, and visitors with the app
        // installed on a phone are normally taken to it by the https link before
        // this page loads. Firefox commonly blocks non-user-initiated custom
        // protocol launches, so there it waits for a click on step 2.
        var isFirefox = /Firefox\//i.test(navigator.userAgent) && !/Seamonkey\//i.test(navigator.userAgent);
        if (!isFirefox) {
          setTimeout(function () {
            window.location.href = addContactUrl;
          }, 50);
        }
      }
    </script>
  </body>
</html>
