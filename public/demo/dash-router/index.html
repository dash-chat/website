    <style>
      :root {
        --bg: #fcfcfc; --surface: #fff;
        --text: #111; --muted: #555; --faint: #888; --border: #e5e7eb;
        --accent: #6E7BFF; --accent-hover: #5662E6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0c0f; --surface: #111318;
          --text: #e5e7eb; --muted: #94a3b8; --faint: #64748b; --border: #1e293b;
          --accent: #8C97FF; --accent-hover: #B0B8FF;
        }
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Rubik", system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.62; -webkit-font-smoothing: antialiased; }
      nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      @supports (backdrop-filter: blur(12px)) { nav { background: color-mix(in srgb, var(--bg) 82%, transparent); } }
      .nav-inner { max-width: 1000px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
      .nav-brand { font-size: 1rem; font-weight: 600; color: var(--text); text-decoration: none; transition: opacity 0.15s; }
      .nav-brand:hover { opacity: 0.7; }
      .nav-links { display: flex; align-items: center; gap: 22px; }
      .nav-links a { font-size: 0.92rem; font-weight: 500; color: var(--muted); text-decoration: none; transition: color 0.15s; }
      .nav-links a:hover { color: var(--text); }
      .nav-links .gh-link { display: flex; align-items: center; color: var(--muted); transition: color 0.15s; }
      main { max-width: 1000px; margin: 0 auto; padding: 100px 24px 48px; }
      h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
      .lede { color: var(--muted); margin-bottom: 28px; max-width: 60ch; }
      .player { background: #000; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
      video { display: block; width: 100%; height: auto; max-height: 80vh; }
      .below { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 0.92rem; color: var(--faint); }
      .below a { color: var(--accent); text-decoration: none; font-weight: 500; }
      .below a:hover { color: var(--accent-hover); text-decoration: underline; }
      footer { max-width: 1000px; margin: 0 auto; padding: 24px; border-top: 1px solid var(--border); color: var(--faint); font-size: 0.88rem; }
      footer a { color: var(--muted); }
    </style>
